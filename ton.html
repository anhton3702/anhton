<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xin chào! Tôi là Ton Ngoc Quynh Anh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 24px;
        }

        .bio {
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            background: #3b82f6;
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Ảnh đại diện tạm thời dạng ký tự viết tắt -->
        <div class="avatar">QA</div>

        <h1>Ton Ngoc Quynh Anh</h1>
        <p class="subtitle">Software Requirements & System Analysis</p>

        <p class="bio">
            Chào mừng bạn đến với trang cá nhân của tôi! Đây là trang web được lưu trữ trực tiếp trên <strong>GitHub Pages</strong>.
        </p>

        <div class="links">
            <a href="https://github.com/anhton3702" class="btn" target="_blank">🔗 Xem GitHub Profile</a>
            <a href="mailto:example@gmail.com" class="btn">✉️ Liên hệ công việc</a>
        </div>

        <footer>
            © 2026 Powered by GitHub Pages
        </footer>
    </div>

</body>
</html>
