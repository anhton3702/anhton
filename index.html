<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chính - Sidebar Navigation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #f1f5f9;
            color: #334155;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.05);
        }

        .sidebar-brand {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            padding: 0 12px;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            background-color: #1e293b;
            color: #38bdf8;
        }

        /* Content Styling */
        .main-content {
            flex: 1;
            padding: 40px;
        }

        .card {
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #0f172a;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-brand">⚡ Dashboard</div>
        <ul class="nav-menu">
            <li>
                <a href="index.html" class="nav-link active">
                    <span>🏠 Trang chủ</span>
                </a>
            </li>
            <li>
                <!-- Đường dẫn tới file ton.html -->
                <a href="ton.html" class="nav-link">
                    <span>👤 Trang Tôn</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Nội dung chính -->
    <main class="main-content">
        <div class="card">
            <h1>Chào mừng bạn!</h1>
            <p>Chọn mục <strong>"Trang Tôn"</strong> trên Sidebar phía bên trái để chuyển sang trang <code>ton.html</code>.</p>
        </div>
    </main>

</body>
</html>
